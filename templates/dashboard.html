{% extends 'base.html' %}
{% block content %}
<div class="dashboard-grid">
  <section class="panel full-width">
    <h2>Tracking</h2>
    <form action="{{ url_for('save_tracking') }}" method="post" class="grid-form" data-save-scroll>
      <select name="intentory_item_oid" required>
        <option value="">Inventory item</option>
        {% for item in items %}
          <option value="{{ item.OID }}">{{ item.Item_Name }}</option>
        {% endfor %}
      </select>
      <input type="number" name="item_count" placeholder="Count" min="0" required>
      <button class="button" type="submit">Add / Update Count</button>
    </form>
  </section>

  <section class="panel full-width">
    <h2>Inventory Count Chart</h2>
    <div class="chart-panel">
      <div class="chart-card">
        <canvas id="inventoryChart"></canvas>
      </div>
    </div>
  </section>

  <section class="panel full-width">
    <h2>Adjust Counts</h2>
    <div class="filter-panel">
      <form method="get" class="inline-form filter-form">
        <select name="ITEM_TYPE_OID">
          <option value="">All Types</option>
          {% for t in item_types %}
            <option value="{{ t.OID }}" {% if selected_type and selected_type|int == t.OID %}selected{% endif %}>{{ t.Product_Type }}</option>
          {% endfor %}
        </select>
        <select name="MODEL_OID">
          <option value="">All Models</option>
          {% for m in item_models %}
            <option value="{{ m.OID }}" {% if selected_model and selected_model|int == m.OID %}selected{% endif %}>{{ m.Model_Number }}</option>
          {% endfor %}
        </select>
        <select name="Manufacturer_oid">
          <option value="">All Manufacturers</option>
          {% for mf in manufacturers %}
            <option value="{{ mf.OID }}" {% if selected_manufacturer and selected_manufacturer|int == mf.OID %}selected{% endif %}>{{ mf.Manufacturer_NAME }}</option>
          {% endfor %}
        </select>
        <button class="button small" type="submit">Filter</button>
        <a class="button small secondary" href="{{ url_for('dashboard') }}">Clear</a>
      </form>
    </div>
    <div class="chart-controls">
      <ul class="control-list">
        {% for tracked in tracked_items %}
          <li class="control-list-item">
            <span class="control-item-label">{{ tracked.item.Item_Name }} — {{ tracked.count }}</span>
            <div class="adjust-row">
              <form action="{{ url_for('adjust_tracking') }}" method="post" class="inline-form adjust-button" data-save-scroll>
                <input type="hidden" name="intentory_item_oid" value="{{ tracked.item.OID }}">
                <input type="hidden" name="delta" value="-1">
                <button class="button small secondary">-</button>
              </form>
              <form action="{{ url_for('adjust_tracking') }}" method="post" class="inline-form adjust-button" data-save-scroll>
                <input type="hidden" name="intentory_item_oid" value="{{ tracked.item.OID }}">
                <input type="hidden" name="delta" value="1">
                <button class="button small">+</button>
              </form>
            </div>
          </li>
        {% endfor %}
      </ul>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  const chartData = {{ chart_data | safe }};
  const labels = chartData.map(item => item.label);
  const counts = chartData.map(item => item.count);
  const hoverItems = chartData;
  const colors = [
    'rgba(168, 77, 147, 0.86)',
    'rgba(255, 138, 190, 0.86)',
    'rgba(255, 98, 165, 0.86)',
    'rgba(193, 45, 105, 0.86)',
    'rgba(238, 159, 205, 0.86)',
    'rgba(215, 77, 120, 0.86)',
    'rgba(200, 80, 150, 0.86)',
    'rgba(242, 137, 180, 0.86)'
  ];
  const backgroundColors = labels.map((_, index) => colors[index % colors.length]);
  const borderColors = labels.map((_, index) => backgroundColors[index].replace('0.86', '1'));

  const ctx = document.getElementById('inventoryChart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Current count',
        data: counts,
        backgroundColor: backgroundColors,
        borderColor: borderColors,
        borderWidth: 1,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          callbacks: {
            title(context) {
              return context[0].label;
            },
            label(context) {
              return `Count: ${context.parsed.x}`;
            },
            afterBody(context) {
              const item = hoverItems[context[0].dataIndex];
              return [
                `Type: ${item.type}`,
                `Model: ${item.model}`,
                `Manufacturer: ${item.manufacturer}`,
                `Updated by: ${item.last_update_user}`,
                `Updated: ${item.last_update_datetime}`
              ];
            }
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          grid: {
            color: 'rgba(168, 77, 147, 0.12)'
          },
          ticks: {
            color: '#5f2141'
          }
        },
        y: {
        }
      }
    }
  });

  const SCROLL_KEY = 'dashboardScrollPosition';
  const saveScrollForms = document.querySelectorAll('form[data-save-scroll]');
  saveScrollForms.forEach(form => {
    form.addEventListener('submit', () => {
      sessionStorage.setItem(SCROLL_KEY, window.scrollY.toString());
    });
  });

  const savedScroll = sessionStorage.getItem(SCROLL_KEY);
  if (savedScroll !== null) {
    window.scrollTo(0, Number(savedScroll));
    sessionStorage.removeItem(SCROLL_KEY);
  }
</script>
{% endblock %}
