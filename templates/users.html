{% extends 'base.html' %}
{% block content %}
<div class="dashboard-grid">
  <section class="panel full-width">
    <h2>User Management</h2>
    <form action="{{ url_for('save_user') }}" method="post" class="grid-form">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="button" type="submit">Add User</button>
    </form>
    <div class="user-table-wrapper">
      <table class="user-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.username }}</td>
            <td>
              <form action="{{ url_for('save_user') }}" method="post" class="inline-form user-form">
                <input type="hidden" name="OID" value="{{ user.OID }}">
                <input type="text" name="username" value="{{ user.username }}" required>
                <input type="password" name="password" placeholder="New password">
                <button class="button small" type="submit">Update</button>
              </form>
              <form action="{{ url_for('delete_user') }}" method="post" class="inline-form user-form">
                <input type="hidden" name="OID" value="{{ user.OID }}">
                <button class="button small secondary" type="submit">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
